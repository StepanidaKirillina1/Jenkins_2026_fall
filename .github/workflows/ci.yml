name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-test:
    name: 'Run tests'
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Get list of changed files
        run: echo "LIST_OF_CHANGED_FILES=$(git diff --name-status $(git merge-base origin/$GITHUB_HEAD_REF origin/main) origin/$GITHUB_HEAD_REF | tr '\n' ';' | tr '\t' '=')" >> $GITHUB_ENV

# tar -cvf jenkins_backup.tar ./jenkins_backup
# split -b 49m -d jenkins_backup.tar jenkins_backup

# git subtree add --prefix=_jenkins_data https://github.com/RedRoverSchool/JenkinsQA_Data_2026_fall.git main --squash

      - name: Prepare Jenkins data
        run: |
          cat ${{ github.workspace }}/_jenkins_data/jenkins_backup* > ${{ github.workspace }}/jenkins_backup.tar
          md5sum ${{ github.workspace }}/jenkins_backup.tar

      - name: Extract Jenkins data and set permission
        run: |
          set -e
          tar -xvf ./jenkins_backup.tar
          chmod -R 777 jenkins_backup/var/jenkins_home

      - name: Docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Docker start
        run: docker run --rm --detach -p 8081:8080 -v ${{ github.workspace }}/jenkins_backup/var/jenkins_home:/var/jenkins_home jenkins/jenkins:2.580.1-lts-jdk25

      - name: Wait for Jenkins ready
        run: |
            ./.github/wait-for-jenkins.sh

      - name: Create user via Jenkins CLI
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker ps -q --filter ancestor=jenkins/jenkins:2.580.1-lts-jdk25)
          INITIAL_PASS=$(docker exec "$CONTAINER_ID" cat /var/jenkins_home/secrets/initialAdminPassword 2>/dev/null || true)
          if [ -z "$INITIAL_PASS" ]; then
            echo "initialAdminPassword not found, skipping user creation"
            exit 0
          fi

          curl -s -o /tmp/jenkins-cli.jar http://localhost:8081/jnlpJars/jenkins-cli.jar

          echo 'jenkins.model.Jenkins.instance.securityRealm.createAccount("${{ secrets.ADMIN_USERNAME }}", "${{ secrets.ADMIN_PASSWORD }}")' | \
            java -jar /tmp/jenkins-cli.jar -s http://localhost:8081/ -http -auth "admin:${INITIAL_PASS}" groovy =

      - name: Pytest
        run: pytest tests/ -v -s
        env:
          JENKINS_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          JENKINS_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JENKINS_HOST: localhost
          JENKINS_PORT: 8081
          BROWSER_NAME: chrome
          BROWSER_OPTIONS_CHROME: --remote-allow-origins=*;--disable-gpu;--no-sandbox;--disable-dev-shm-usage;--headless=new;--window-size=1920,1080
          RUN_CI: true

      - name: Add screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: ignore
